  seasons: [kharif_1]
  sowing_window: {start: "04-01", end: "05-15"}
  duration_days: 120
  soil_suitability: {loam: 1.0, clay_loam: 0.9, sandy_loam: 0.8, clay: 0.7, sandy: 0.5}
  water_requirement_mm: 500             # rainfed early monsoon
  temp_range_c: {min: 20, max: 38}
  yield_per_acre_kg: 900                 # dry fibre
  price_per_kg_bdt: 60
  seed_kg_per_acre: 4
  seed_price_per_kg_bdt: 120
  labour_bdt_per_acre: 8000
  irrigation_bdt_per_acre: 1000
  fertilizer_schedule:      # BJRI tossa jute kg/ha / 2.471 -> kg/acre
    - {day: 0,  input: tsp,    kg_per_acre: 34, note: "basal at final land prep"}
    - {day: 0,  input: mp,     kg_per_acre: 26, note: "basal at final land prep"}
    - {day: 0,  input: gypsum, kg_per_acre: 36, note: "basal at final land prep"}
    - {day: 0,  input: urea,   kg_per_acre: 34, note: "half urea basal"}
    - {day: 45, input: urea,   kg_per_acre: 35, note: "remaining urea at 42-50 DAS (plant 10-12 cm)"}
  irrigation:
    - {stage: "establishment", day_from: 0,  day_to: 25, depth_cm: 3, note: "usually rain-supplied"}
  pest_windows:
    - {pest: "Jute hairy caterpillar", day_from: 20, day_to: 50,
       sign: "gregarious larvae skeletonising leaves",
       control: "Handpick egg masses; Chlorpyrifos if severe", cost_bdt_per_acre: 700}
    - {pest: "Jute stem weevil", day_from: 40, day_to: 80,
       sign: "swellings/galls on stem, tunnelled bark lowering fibre grade",
       control: "Early thinning; Carbofuran granules", cost_bdt_per_acre: 500}
  stages:
    - {name: "Sowing",       day_from: 0,  day_to: 3}
    - {name: "Establishment & thinning", day_from: 3, day_to: 25}
    - {name: "Vegetative",   day_from: 25, day_to: 90}
    - {name: "Maturity",     day_from: 90, day_to: 110}
    - {name: "Harvest & retting", day_from: 110, day_to: 120}
  sources:
    - "http://www.bjri.gov.bd/"

mustard:
  label: "Mustard / Sarisha (Rabi oilseed)"
  seasons: [rabi]
  sowing_window: {start: "10-15", end: "11-15"}
  duration_days: 85                      # short-duration; fits between Aman and Boro
  soil_suitability: {loam: 1.0, clay_loam: 0.9, sandy_loam: 0.8, sandy: 0.6, clay: 0.5}
  water_requirement_mm: 250
  temp_range_c: {min: 10, max: 30}
  yield_per_acre_kg: 500
  price_per_kg_bdt: 75
  seed_kg_per_acre: 3
  seed_price_per_kg_bdt: 130
  labour_bdt_per_acre: 4500
  irrigation_bdt_per_acre: 1200
  fertilizer_schedule:      # BARI mustard kg/ha / 2.471 -> kg/acre (heavy N & S feeder)
    - {day: 0,  input: tsp,    kg_per_acre: 73, note: "basal at final land prep"}
    - {day: 0,  input: mp,     kg_per_acre: 36, note: "basal at final land prep"}
    - {day: 0,  input: gypsum, kg_per_acre: 69, note: "basal — mustard is very responsive to sulphur"}
    - {day: 0,  input: urea,   kg_per_acre: 74, note: "~2/3 urea basal"}
    - {day: 25, input: urea,   kg_per_acre: 37, note: "top dressing before flowering, at 1st irrigation"}
  irrigation:
    - {stage: "vegetative", day_from: 20, day_to: 30, depth_cm: 4}
    - {stage: "flowering-pod", day_from: 45, day_to: 60, depth_cm: 4}
  pest_windows:
    - {pest: "Mustard aphid", day_from: 35, day_to: 65,
       sign: "dense colonies on flowering shoots and pods — the major mustard pest",
       control: "Imidacloprid / Malathion at first colonies", cost_bdt_per_acre: 800}
    - {pest: "Alternaria blight", day_from: 45, day_to: 75,
       sign: "concentric dark leaf/pod spots in dewy weather",
       control: "Iprodione or Mancozeb spray", cost_bdt_per_acre: 600}
  stages:
    - {name: "Sowing",       day_from: 0,  day_to: 3}
    - {name: "Vegetative",   day_from: 3,  day_to: 30}
    - {name: "Flowering",    day_from: 30, day_to: 55}
    - {name: "Pod-fill",     day_from: 55, day_to: 75}
    - {name: "Maturity",     day_from: 75, day_to: 85}
  sources:
    - "https://www.bamis.gov.bd/en/croppnp/1/all/all/"
    - "http://www.bari.gov.bd/"

