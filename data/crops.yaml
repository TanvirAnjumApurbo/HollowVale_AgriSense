  fertilizer_schedule:      # BARI chili kg/ha / 2.471 -> kg/acre
    - {day: 0,  input: tsp,           kg_per_acre: 61, note: "basal at final land prep"}
    - {day: 0,  input: gypsum,        kg_per_acre: 40, note: "basal at final land prep"}
    - {day: 0,  input: zinc_sulphate, kg_per_acre: 4,  note: "basal at final land prep"}
    - {day: 0,  input: boric_acid,    kg_per_acre: 3,  note: "basal at final land prep"}
    - {day: 0,  input: urea,          kg_per_acre: 27, note: "1/3 urea basal"}
    - {day: 0,  input: mp,            kg_per_acre: 25, note: "half MoP basal"}
