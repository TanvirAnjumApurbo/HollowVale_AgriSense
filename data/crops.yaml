    - {day: 35, input: urea,   kg_per_acre: 33, note: "2nd top dressing, max tillering"}
  irrigation:
    - {stage: "establishment", day_from: 0,  day_to: 25, depth_cm: 3, note: "pre-monsoon; irrigate until the rains set in"}
    - {stage: "reproductive",  day_from: 55, day_to: 80, depth_cm: 4, note: "keep saturated at flowering"}
  pest_windows:
    - {pest: "Yellow stem borer", day_from: 25, day_to: 55,
       sign: "dead hearts in the vegetative stage",
       control: "Cartap or Fipronil at first dead-hearts", cost_bdt_per_acre: 800}
    - {pest: "Rice hispa", day_from: 20, day_to: 50,
       sign: "parallel white scrape-marks along the leaf blade",
       control: "hand-net the beetles; Chlorpyrifos if severe", cost_bdt_per_acre: 500}
  stages:
    - {name: "Land preparation / seedbed", day_from: -20, day_to: 0}
    - {name: "Establishment",      day_from: 0,  day_to: 25}
    - {name: "Tillering",          day_from: 25, day_to: 55}
    - {name: "Panicle initiation", day_from: 55, day_to: 70}
    - {name: "Flowering",          day_from: 70, day_to: 90}
    - {name: "Grain-fill & maturity", day_from: 90, day_to: 105}
  sources:
    - "http://www.brri.gov.bd/"
    - "https://www.bamis.gov.bd/en/croppnp/1/all/all/"

onion:
  label: "Onion / Piyaj (Rabi bulb crop)"
  seasons: [rabi]
  sowing_window: {start: "11-01", end: "12-15"}   # seedling transplanting
  duration_days: 120
  soil_suitability: {clay: 0.3, clay_loam: 0.7, loam: 1.0, sandy_loam: 1.0, sandy: 0.6}  # needs well-drained soil, hates waterlogging
  water_requirement_mm: 450
  temp_range_c: {min: 13, max: 30}
  yield_per_acre_kg: 4500
  price_per_kg_bdt: 45                  # volatile; harvest-season farm-gate estimate
  seed_kg_per_acre: 4
  seed_price_per_kg_bdt: 1800           # true onion seed is expensive
  labour_bdt_per_acre: 15000            # transplanting + repeated weeding
  irrigation_bdt_per_acre: 3500
  fertilizer_schedule:      # BARI onion kg/ha / 2.471 -> kg/acre (heavy N & S feeder)
    - {day: 0,  input: tsp,           kg_per_acre: 61, note: "basal at final land prep"}
    - {day: 0,  input: gypsum,        kg_per_acre: 45, note: "basal — onion is responsive to sulphur"}
    - {day: 0,  input: zinc_sulphate, kg_per_acre: 4,  note: "basal at final land prep"}
    - {day: 0,  input: boric_acid,    kg_per_acre: 3,  note: "basal at final land prep"}
    - {day: 0,  input: urea,          kg_per_acre: 34, note: "1/3 urea basal"}
    - {day: 0,  input: mp,            kg_per_acre: 30, note: "half MoP basal"}
    - {day: 25, input: urea,          kg_per_acre: 34, note: "1st top dressing, 25-30 DAT"}
    - {day: 45, input: urea,          kg_per_acre: 33, note: "2nd top dressing before bulbing"}
    - {day: 45, input: mp,            kg_per_acre: 31, note: "remaining MoP at bulbing"}
  irrigation:
    - {stage: "establishment", day_from: 5,  day_to: 20, depth_cm: 3}
    - {stage: "bulbing",       day_from: 45, day_to: 85, depth_cm: 4, note: "critical — steady moisture; stop ~10 days before harvest"}
  pest_windows:
    - {pest: "Onion thrips", day_from: 30, day_to: 80,
       sign: "silvery streaks and curling on leaves in dry spells",
       control: "Spinosad / Imidacloprid at threshold", cost_bdt_per_acre: 900}
    - {pest: "Purple blotch (Alternaria)", day_from: 40, day_to: 90,
       sign: "purple-centred lesions on leaves in dewy weather",
       control: "Mancozeb or Iprodione spray", cost_bdt_per_acre: 800}
  stages:
    - {name: "Transplanting",     day_from: 0,   day_to: 5}
    - {name: "Establishment",     day_from: 5,   day_to: 30}
    - {name: "Vegetative",        day_from: 30,  day_to: 55}
    - {name: "Bulbing",           day_from: 55,  day_to: 100}
    - {name: "Maturity & curing", day_from: 100, day_to: 120}
  sources:
    - "http://www.bari.gov.bd/"
    - "https://www.bamis.gov.bd/en/croppnp/1/all/all/"

