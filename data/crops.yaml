    - "http://www.bari.gov.bd/"
    - "https://www.bamis.gov.bd/en/croppnp/1/all/all/"

tomato:
  label: "Tomato (Rabi winter vegetable)"
  seasons: [rabi]
  sowing_window: {start: "10-15", end: "11-30"}   # seedling transplanting
  duration_days: 110
  soil_suitability: {clay: 0.4, clay_loam: 0.8, loam: 1.0, sandy_loam: 0.9, sandy: 0.6}
  water_requirement_mm: 450
  temp_range_c: {min: 15, max: 30}
  yield_per_acre_kg: 9000
  price_per_kg_bdt: 30
  seed_kg_per_acre: 0.15
  seed_price_per_kg_bdt: 18000          # hybrid tomato seed
  labour_bdt_per_acre: 15000            # staking, pruning, harvesting
  irrigation_bdt_per_acre: 3000
  fertilizer_schedule:      # BARI tomato kg/ha / 2.471 -> kg/acre (heavy feeder)
    - {day: 0,  input: tsp,                kg_per_acre: 73, note: "basal at final land prep"}
    - {day: 0,  input: gypsum,             kg_per_acre: 40, note: "basal at final land prep"}
    - {day: 0,  input: zinc_sulphate,      kg_per_acre: 4,  note: "basal at final land prep"}
    - {day: 0,  input: boric_acid,         kg_per_acre: 4,  note: "basal — boron guards against fruit cracking"}
    - {day: 0,  input: magnesium_sulphate, kg_per_acre: 30, note: "basal at final land prep"}
    - {day: 0,  input: urea,               kg_per_acre: 30, note: "1/3 urea basal"}
    - {day: 0,  input: mp,                 kg_per_acre: 30, note: "half MoP basal"}
    - {day: 25, input: urea,               kg_per_acre: 30, note: "1st top dressing"}
    - {day: 45, input: urea,               kg_per_acre: 29, note: "2nd top dressing at fruit set"}
    - {day: 45, input: mp,                 kg_per_acre: 31, note: "remaining MoP at fruit set"}
  irrigation:
    - {stage: "establishment",   day_from: 5,  day_to: 20, depth_cm: 3}
    - {stage: "flowering-fruit", day_from: 40, day_to: 90, depth_cm: 4, note: "even moisture prevents blossom-end rot and cracking"}
  pest_windows:
    - {pest: "Tomato fruit borer", day_from: 45, day_to: 95,
       sign: "bore holes at the calyx end of the fruit",
       control: "Pheromone traps + Emamectin benzoate", cost_bdt_per_acre: 1100}
    - {pest: "Late blight", day_from: 30, day_to: 75,
       sign: "water-soaked leaf/stem lesions spreading fast in cool foggy weather",
       control: "Preventive Mancozeb; Cymoxanil+Mancozeb once seen", cost_bdt_per_acre: 1500}
  stages:
    - {name: "Transplanting",           day_from: 0,  day_to: 5}
    - {name: "Establishment",           day_from: 5,  day_to: 25}
    - {name: "Vegetative",              day_from: 25, day_to: 45}
    - {name: "Flowering & fruit set",   day_from: 45, day_to: 70}
    - {name: "Fruiting & harvest",      day_from: 70, day_to: 110}
  sources:
    - "http://www.bari.gov.bd/"
    - "https://www.bamis.gov.bd/en/croppnp/1/all/all/"

chickpea:
  label: "Chickpea / Chola (Rabi pulse)"
  seasons: [rabi]
  sowing_window: {start: "10-25", end: "11-30"}
  duration_days: 120
  soil_suitability: {clay: 0.4, clay_loam: 0.9, loam: 1.0, sandy_loam: 0.9, sandy: 0.6}  # dislikes waterlogging
  water_requirement_mm: 180             # residual-moisture crop, minimal irrigation
  temp_range_c: {min: 12, max: 30}
  yield_per_acre_kg: 520
  price_per_kg_bdt: 85
  seed_kg_per_acre: 16
  seed_price_per_kg_bdt: 100
  labour_bdt_per_acre: 4000
  irrigation_bdt_per_acre: 800
  fertilizer_schedule:      # BARI chickpea, single basal (legume fixes most of its N) kg/ha / 2.471 -> kg/acre
    - {day: 0, input: urea,   kg_per_acre: 16, note: "starter N basal — legume fixes the rest"}
    - {day: 0, input: tsp,    kg_per_acre: 32, note: "basal at sowing"}
    - {day: 0, input: mp,     kg_per_acre: 16, note: "basal at sowing"}
    - {day: 0, input: gypsum, kg_per_acre: 20, note: "basal — sulphur for the pulse"}
  irrigation:
    - {stage: "pre-flower", day_from: 30, day_to: 45, depth_cm: 3, note: "one light irrigation only if the soil dries out"}
  pest_windows:
    - {pest: "Pod borer (Helicoverpa)", day_from: 55, day_to: 95,
       sign: "larvae boring into developing pods — the major chickpea pest",
       control: "Pheromone traps + Emamectin benzoate at flowering", cost_bdt_per_acre: 700}
    - {pest: "Botrytis grey mould", day_from: 50, day_to: 80,
       sign: "grey fungal growth on shoots/pods in a humid, dense canopy",
       control: "Carbendazim spray; wider spacing", cost_bdt_per_acre: 500}
  stages:
    - {name: "Sowing",     day_from: 0,   day_to: 3}
    - {name: "Vegetative", day_from: 3,   day_to: 45}
    - {name: "Flowering",  day_from: 45,  day_to: 70}
    - {name: "Podding",    day_from: 70,  day_to: 100}
    - {name: "Maturity",   day_from: 100, day_to: 120}
  sources:
    - "http://www.bari.gov.bd/"
    - "https://www.bamis.gov.bd/en/croppnp/1/all/all/"
