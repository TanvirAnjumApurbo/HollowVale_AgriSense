# Fertilizer input prices — BDT per kg of actual fertilizer MATERIAL
# (not per kg of nutrient). Bangladesh retail/dealer ranges, 2024-25.
# Urea/TSP/MoP track the government-set dealer rates; gypsum, zinc,
# boron and magnesium are open-market retail.
#
# These keys are referenced by `input:` in data/crops.yaml. The financial
# engine derives each crop's fertilizer cost as
#     sum(kg_per_acre * price)  over the fertilizer_schedule,
# so this file is the single source of truth for fertilizer pricing and
# the demo's fertilizer numbers are inspectable rather than a flat guess.

urea: 27               # 46% N
tsp: 30                # Triple Super Phosphate (~46% P2O5)
mp: 25                 # Muriate of Potash / MoP (~60% K2O)
dap: 40                # Di-Ammonium Phosphate (18% N, 46% P2O5)
gypsum: 15             # sulphur source (~18% S)
zinc_sulphate: 120     # micronutrient (Zn)
boric_acid: 250        # micronutrient (B)
magnesium_sulphate: 35 # MgSO4 (Mg + S)

# Added for broader crop coverage + organic-alternative costing. NPKS is a
# blended compound; lime/dolomite corrects acid soils; SOP is a chloride-free
# potash for quality-sensitive crops; cow dung is priced here so organic-vs-
# chemical comparisons have a number (in practice it is often farmer-supplied).
npks_16: 30            # NPKS compound blend (~16-16-16 + S)
sop: 65                # Sulphate of Potash / K2SO4 (~50% K2O, chloride-free)
ammonium_sulphate: 27  # AS (~21% N, 24% S) — N + sulphur source
lime: 18               # agricultural lime / dolomite (soil acidity correction)
cow_dung: 3            # decomposed farmyard manure / compost, per kg
